[project]
name = "newsmap"
version = "0.1.0"
description = "Composable toolkit for publication-quality analytical news maps"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.8",
    "cartopy>=0.22",
    "shapely>=2.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
newsmap = "make_map:main"
